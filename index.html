<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BharatAI - Scheme Navigator</title>
  <!-- Material Symbols -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN with plugins -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#002045",
            "primary-container": "#1a365d",
            "on-primary": "#ffffff",
            "on-primary-container": "#86a0cd",
            "secondary": "#8f4e00",
            "secondary-container": "#fe9832",
            "on-secondary": "#ffffff",
            "tertiary": "#012800",
            "tertiary-container": "#024000",
            "on-tertiary": "#ffffff",
            "on-tertiary-container": "#49b538",
            "background": "#f7f9fb",
            "on-background": "#191c1e",
            "surface": "#f7f9fb",
            "on-surface": "#191c1e",
            "surface-variant": "#e0e3e5",
            "on-surface-variant": "#43474e",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f2f4f6",
            "surface-container": "#eceef0",
            "surface-container-high": "#e6e8ea",
            "surface-container-highest": "#e0e3e5",
            "outline": "#74777f",
            "outline-variant": "#c4c6cf",
            "error": "#ba1a1a",
            "on-error": "#ffffff",
            "error-container": "#ffdad6"
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          spacing: {
            "stack-sm": "8px",
            "stack-md": "16px",
            "stack-lg": "32px",
            "gutter": "24px",
            "container-max": "1280px",
            "margin-desktop": "32px",
            "margin-mobile": "16px"
          },
          fontFamily: {
            sans: ["Inter", "sans-serif"]
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1;
    }
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1; 
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1; 
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8; 
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-sans">

  <!-- Persistent Top Header -->
  <header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-4 md:px-8 h-16 bg-surface border-b border-outline-variant shadow-sm">
    <div class="flex items-center gap-3 cursor-pointer" id="header-brand">
      <div class="w-9 h-9 rounded-full bg-primary flex items-center justify-center text-white font-bold text-lg shadow-inner">
        🇮🇳
      </div>
      <span class="text-xl font-bold text-primary">BharatAI</span>
    </div>
    <div class="flex items-center gap-2">
      <div class="flex items-center bg-surface-container rounded px-2 py-1 border border-outline-variant text-xs font-semibold text-on-surface-variant">
        <button id="lang-en" class="px-1.5 py-0.5 rounded bg-primary text-white transition-all">EN</button>
        <span class="mx-1 text-outline">|</span>
        <button id="lang-hi" class="px-1.5 py-0.5 rounded hover:bg-surface-container-high transition-all">हिंदी</button>
        <span class="mx-1 text-outline">|</span>
        <button id="lang-mr" class="px-1.5 py-0.5 rounded hover:bg-surface-container-high transition-all">मराठी</button>
      </div>
    </div>
  </header>

  <!-- Main Dynamic View Canvas -->
  <main id="app-container" class="flex-grow pt-[80px] pb-[96px] md:pb-[40px] px-4 md:px-8 flex justify-center items-start overflow-y-auto">
    <!-- View content rendered via main.js -->
  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-16 px-4 bg-surface border-t border-outline-variant shadow-lg">
    <button data-nav="form" class="nav-btn flex flex-col items-center justify-center text-primary font-semibold transition-all">
      <span class="material-symbols-outlined text-2xl">home</span>
      <span class="text-xs">Form</span>
    </button>
    <button data-nav="schemes" class="nav-btn flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all">
      <span class="material-symbols-outlined text-2xl">apps</span>
      <span class="text-xs">Eligible</span>
    </button>
    <button data-nav="reasoning" class="nav-btn flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all">
      <span class="material-symbols-outlined text-2xl">psychology</span>
      <span class="text-xs">AI Insight</span>
    </button>
    <button data-nav="ineligible" class="nav-btn flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all">
      <span class="material-symbols-outlined text-2xl">cancel</span>
      <span class="text-xs">Unqualified</span>
    </button>
  </nav>

  <script type="module" src="/main.js"></script>
</body>
</html>
